spring:
  datasource:
    url: jdbc:h2:mem:fishing_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql: SET TIME ZONE '+08:00'
  h2:
    console:
      enabled: false

fishing:
  registration:
    enabled: true
