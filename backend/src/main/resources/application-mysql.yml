spring:
  flyway:
    locations: classpath:db/migration,classpath:db/mysql-migration
  datasource:
    url: ${FISHING_DB_URL}
    username: ${FISHING_DB_USERNAME}
    password: ${FISHING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  h2:
    console:
      enabled: false

fishing:
  registration:
    enabled: false
  bootstrap-admin:
    username: ${FISHING_BOOTSTRAP_ADMIN_USERNAME:}
    display-name: ${FISHING_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
    password: ${FISHING_BOOTSTRAP_ADMIN_PASSWORD:}
