spring:
  application:
    name: fishing-platform
  profiles:
    default: demo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    jdbc-type-for-null: 'NULL'

server:
  port: ${FISHING_SERVER_PORT:18080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    com.fishing.platform.mapper: info
